set timeout=0
set default=0

menuentry "Cact (kernel + multiboot module)" {
    insmod all_video
    insmod vbe
    insmod vga
    insmod gfxterm
    set gfxmode=auto
    set gfxpayload=auto
    multiboot2 /boot/kernel.bin
    module2   /boot/MB2_MODULE_PLACEHOLDER MB2_CMDLINE_PLACEHOLDER
    boot
}
